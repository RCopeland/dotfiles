# Restores the kwin "Toggle Terminal" global shortcuts.
# Merged into ~/.config/kglobalshortcutsrc by the yadm bootstrap via kwriteconfig6.
# Values are copied verbatim from this machine's live kglobalshortcutsrc:
# format is current,default,description (comma-separated).
[kwin]
ToggleTerminal_0=Alt+`,none,Toggle Terminal hotkey #0
ToggleTerminal_1=Meta+`,none,Toggle Terminal hotkey #1
ToggleTerminal_2=Meta+`,none,Toggle Terminal hotkey #2
ToggleTerminal_3=Meta+`,none,Toggle Terminal hotkey #3
ToggleTerminal_4=Meta+`,none,Toggle Terminal hotkey #4
ToggleTerminal_5=Meta+`,none,Toggle Terminal hotkey #5
ToggleTerminal_6=Meta+`,none,Toggle Terminal hotkey #6
ToggleTerminal_7=Meta+`,none,Toggle Terminal hotkey #7
ToggleTerminal_8=Meta+`,none,Toggle Terminal hotkey #8
ToggleTerminal_9=Meta+`,none,Toggle Terminal hotkey #9
