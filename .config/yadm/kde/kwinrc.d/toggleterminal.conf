# Enables the kwin "Toggle Terminal" script and configures hotkey #0.
# Merged into ~/.config/kwinrc by the yadm bootstrap via kwriteconfig6.
# The script itself lives in ~/.local/share/kwin/scripts/toggleterminal
# (tracked by yadm), so it is restored on clone.
[Plugins]
toggleterminalEnabled=true

[Script-toggleterminal]
0_launchCommand=/usr/bin/alacritty
0_windowClass=Alacritty
